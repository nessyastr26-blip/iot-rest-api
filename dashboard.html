<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; padding:20px; color:#333; }
.container { max-width:1000px; margin:0 auto; }
h1 { color:#fff; text-align:center; margin-bottom:25px; font-size:28px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:25px; }
.card, .panel { background:#fff; border-radius:15px; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,.2); }
.card { text-align:center; }
.panel { margin-bottom:25px; }
.panel h2 { font-size:18px; margin-bottom:15px; color:#444; }
.label { font-size:14px; color:#888; text-transform:uppercase; letter-spacing:1px; }
.value { font-size:42px; font-weight:bold; margin:10px 0; color:#667eea; }
.unit { font-size:18px; color:#aaa; }
.badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; }
.online { background:#d4edda; color:#155724; } .offline { background:#f8d7da; color:#721c24; }
.controls { display:flex; gap:15px; flex-wrap:wrap; align-items:center; }
.btn { padding:12px 30px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; color:#fff; }
.btn-on { background:#28a745; } .btn-off { background:#dc3545; } .btn-set { background:#667eea; }
input { padding:10px; border:1px solid #ccc; border-radius:8px; width:110px; }
#alertBox { display:none; background:#f8d7da; color:#721c24; padding:15px; border-radius:10px; margin-bottom:20px; font-weight:600; }
table { width:100%; border-collapse:collapse; }
th,td { padding:10px; text-align:left; border-bottom:1px solid #eee; font-size:14px; }
th { background:#f8f9fa; color:#666; font-size:12px; text-transform:uppercase; }
#log { background:#1e1e1e; color:#0f0; font-family:monospace; padding:15px; border-radius:10px; max-height:180px; overflow-y:auto; font-size:13px; }
#log .error { color:#f66; } #log .info { color:#6af; }
</style>
</head>
<body>
<div class="container">
  <h1>IoT Dashboard — REST API</h1>
  <div id="alertBox"></div>

  <div class="cards">
    <div class="card"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
    <div class="card"><div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px"><span class="badge offline" id="badge">OFFLINE</span></div>
      <div class="unit" id="batasInfo">Batas suhu: belum diset</div></div>
  </div>

  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
      <span>Batas suhu (°C):</span>
      <input type="number" id="inpBatas" step="0.1" value="28">
      <button class="btn btn-set" onclick="setBatas()">Set Batas</button>
    </div>
  </div>

  <div class="panel"><h2>Grafik Suhu &amp; Kelembaban (real-time)</h2><canvas id="chart" height="110"></canvas></div>

  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table><thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
    <tbody id="history-body"><tr><td colspan="3">Loading...</td></tr></tbody></table>
  </div>

  <div class="panel"><h2>Log Aktivitas</h2><div id="log"></div></div>
</div>

<script>
const API_BASE = 'http://localhost:1880/api';
const API_KEY  = 'iot-kampus-123';           // BONUS 3: dikirim lewat header X-API-Key
const HEADERS  = { 'Content-Type':'application/json', 'X-API-Key':API_KEY };
let lastAlertTime = null;

function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// BONUS 2: Chart.js
const chart = new Chart(document.getElementById('chart'), {
  type:'line',
  data:{ labels:[], datasets:[
    { label:'Suhu (°C)', data:[], borderColor:'#dc3545', tension:.3 },
    { label:'Kelembaban (%)', data:[], borderColor:'#667eea', tension:.3 } ]},
  options:{ animation:false, responsive:true }
});

async function fetchSensor() {
  try {
    const res = await fetch(`${API_BASE}/suhu`, { headers:HEADERS });
    const json = await res.json();
    const badge = document.getElementById('badge');
    if (json.status === 'success' && json.data.suhu !== null) {
      document.getElementById('suhu').textContent = json.data.suhu;
      document.getElementById('kelembaban').textContent = json.data.kelembaban;
      badge.textContent = 'ONLINE'; badge.className = 'badge online';
    } else {
      badge.textContent = 'OFFLINE'; badge.className = 'badge offline';
      if (json.status === 'error') log(json.message, 'error');
    }
    document.getElementById('batasInfo').textContent =
      json.threshold != null ? `Batas suhu: ${json.threshold} °C` : 'Batas suhu: belum diset';
    const box = document.getElementById('alertBox');
    if (json.alert) {
      box.style.display = 'block'; box.textContent = '⚠ ' + json.alert.message;
      if (json.alert.time !== lastAlertTime) { lastAlertTime = json.alert.time; log(json.alert.message, 'error'); }
    } else box.style.display = 'none';
  } catch (err) { log(`Gagal fetch sensor: ${err.message}`, 'error'); }
}

async function fetchHistory() {
  try {
    const res = await fetch(`${API_BASE}/history`, { headers:HEADERS });
    const json = await res.json();
    if (!json.data || !json.data.length) return;
    const last = json.data.slice(-10).reverse();
    document.getElementById('history-body').innerHTML = last.map(d =>
      `<tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('');
    chart.data.labels = json.data.map(d => new Date(d.received).toLocaleTimeString());
    chart.data.datasets[0].data = json.data.map(d => d.suhu);
    chart.data.datasets[1].data = json.data.map(d => d.kelembaban);
    chart.update();
  } catch (err) { log(`Gagal fetch history: ${err.message}`, 'error'); }
}

async function kontrol(device, action) {
  try {
    const res = await fetch(`${API_BASE}/kontrol`, { method:'POST', headers:HEADERS, body:JSON.stringify({device, action}) });
    const json = await res.json();
    json.status === 'success' ? log(`Perintah terkirim: ${device} → ${action}`) : log(`Gagal: ${json.message}`, 'error');
  } catch (err) { log(`Error kontrol: ${err.message}`, 'error'); }
}

// BONUS 1: set threshold (PUT)
async function setBatas() {
  const v = parseFloat(document.getElementById('inpBatas').value);
  try {
    const res = await fetch(`${API_BASE}/threshold`, { method:'PUT', headers:HEADERS, body:JSON.stringify({suhu_max:v}) });
    const json = await res.json();
    json.status === 'success' ? log(`Batas suhu diset ke ${v} °C`) : log(`Gagal: ${json.message}`, 'error');
    fetchSensor();
  } catch (err) { log(`Error set batas: ${err.message}`, 'error'); }
}

log('Dashboard dimulai, polling setiap 3 detik...');
fetchSensor(); fetchHistory();
setInterval(fetchSensor, 3000);
setInterval(fetchHistory, 5000);
</script>
</body>
</html>
